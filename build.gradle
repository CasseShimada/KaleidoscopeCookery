plugins {
    id 'eclipse'
    id 'idea'
    id 'fabric-loom' version '1.14.10'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName.set(project.archives_base_name)
}

loom {
    accessWidenerPath = file("src/main/resources/kaleidoscope_cookery.accesswidener")
}

fabricApi {
    configureDataGeneration()
}

repositories {
    maven { url = "https://maven.shedaniel.me" }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com/"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // JEI：只保留一个可用的 Fabric 版本，避免与 common-api / fabric-api 重复类
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") {
        exclude group: "mezz.jei", module: "jei-${project.minecraft_version}-common-api-intermediary"
        exclude group: "mezz.jei", module: "jei-${project.minecraft_version}-fabric-api"
    }
    modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") {
        exclude group: "mezz.jei", module: "jei-${project.minecraft_version}-common-api-intermediary"
        exclude group: "mezz.jei", module: "jei-${project.minecraft_version}-fabric-api"
    }
    modImplementation "curse.maven:jade-324717:7427066"
    modImplementation "curse.maven:roughly-enough-items-310111:7486489"
    modImplementation "curse.maven:cloth-config-348521:7361438"
    modApi("me.shedaniel.cloth:basic-math:+")
    modImplementation "curse.maven:architectury-api-419699:7339256"
}

def modVersion = project.version
def minecraftVersion = project.minecraft_version
def loaderVersion = project.loader_version

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                "version": modVersion,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion
        )
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}
