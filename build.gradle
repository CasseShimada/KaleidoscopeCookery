plugins {
    id 'eclipse'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.15.5'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName.set(project.archives_base_name)
}

loom {
    accessWidenerPath = file("src/main/resources/kaleidoscope_cookery.accesswidener")
}

fabricApi {
    configureDataGeneration {
        outputDirectory.set(layout.buildDirectory.file("generated/datagen"))
        addToResources.set(false)
    }
}

sourceSets {
    main {
        java {
            // These legacy compat modules are not wired to optional dependencies or entrypoints yet.
            // Keep them out of the common jar until each compat path is restored as a dedicated client integration.
            exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/jade/**'
            exclude 'com/github/ysbbbbbb/kaleidoscopecookery/compat/rei/**'
        }
    }
}

repositories {
    maven { url = "https://maven.shedaniel.me" }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com/"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
}

def modVersion = project.version
def minecraftVersion = project.minecraft_version
def loaderVersion = project.loader_version
def fabricVersion = project.fabric_version

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    inputs.property "fabric_version", fabricVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                "version": modVersion,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion,
                "fabric_version": fabricVersion
        )
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}
