plugins {
    id 'eclipse'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.15.5'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName.set(project.archives_base_name)
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/kaleidoscope_cookery.accesswidener")

    mods {
        "kaleidoscope_cookery" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        outputDirectory.set(file("src/main/generated"))
        addToResources.set(true)
        createSourceSet.set(true)
        modId.set("kaleidoscope_cookery-datagen")
    }

    configureTests {
        createSourceSet.set(true)
        modId.set("kaleidoscope_cookery_gametest")
        enableClientGameTests.set(project.findProperty("clientCompatGameTests") == "true")
    }
}

repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = "CasseShimada WTHIT releases"
                url = uri("https://github.com/CasseShimada/wthit/releases/download")
                patternLayout {
                    artifact("[revision]/wthit-26.2-fabric-[revision](-[classifier]).[ext]")
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeGroup "com.github.casseshimada.wthit"
        }
    }
    maven {
        name = "Badasintended"
        url = "https://maven2.bai.lol"
        content {
            includeGroup "lol.bai"
        }
    }
    maven { url = "https://maven.shedaniel.me" }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com/"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly "maven.modrinth:jade:${project.jade_version}"
    compileOnly "com.github.casseshimada.wthit:wthit:${project.wthit_version}:api"
    clientCompileOnly "maven.modrinth:rei:${project.rei_version}"
    // REI's public EntryStacks signatures expose Architectury FluidStack even for item-only calls.
    clientCompileOnly "maven.modrinth:architectury-api:${project.architectury_version}"
    clientCompileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"

    // Opt-in runtime used only by the reproducible optional-integration GameTest command.
    if (project.findProperty("farmersDelightCompatSmoke") == "true") {
        runtimeOnly "maven.modrinth:farmers-delight-refabricated:26.2-3.6.7"
    }
    // Opt-in local API 1 builds. Their public APIs are not remotely published yet, so these
    // source sets and runtimes never participate in the default/release build.
    if (project.findProperty("carryOnCompatJar")) {
        gametestCompileOnly files(project.property("carryOnCompatJar"))
        runtimeOnly files(project.property("carryOnCompatJar"))
    }
    if (project.findProperty("diggusMaximusCompatJar")) {
        gametestCompileOnly files(project.property("diggusMaximusCompatJar"))
        runtimeOnly files(project.property("diggusMaximusCompatJar"))
    }
    if (project.findProperty("wthitCompatSmoke") == "true") {
        runtimeOnly "com.github.casseshimada.wthit:wthit:${project.wthit_version}"
        runtimeOnly "lol.bai:badpackets:fabric-${project.badpackets_version}"
    }
    if (project.findProperty("clientCompatSmoke") == "true") {
        // Architectury 21.0.4, required by the target REI build, needs Fabric API 0.154+.
        runtimeOnly "net.fabricmc.fabric-api:fabric-api:0.154.0+26.2"
        runtimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
        runtimeOnly "maven.modrinth:jade:${project.jade_version}"
        runtimeOnly "maven.modrinth:rei:${project.rei_version}"
        runtimeOnly "maven.modrinth:architectury-api:${project.architectury_version}"
        runtimeOnly "maven.modrinth:cloth-config:26.2.155+fabric"
        runtimeOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"
        runtimeOnly "maven.modrinth:foodeffecttooltips:2.1.2+26.2"
        runtimeOnly "maven.modrinth:farmers-delight-refabricated:26.2-3.6.7"
    }
}

if (project.findProperty("carryOnCompatJar")) {
    sourceSets.gametest.java.srcDir("src/compatTest/carryon/java")
}
if (project.findProperty("diggusMaximusCompatJar")) {
    sourceSets.gametest.java.srcDir("src/compatTest/diggusmaximus/java")
}

configurations {
    wthitApiArtifact
}

dependencies {
    wthitApiArtifact "com.github.casseshimada.wthit:wthit:${project.wthit_version}:api"
}

def expectedWthitApiSha256 = project.wthit_api_sha256
tasks.register("verifyWthitApiArtifact") {
    inputs.files(configurations.wthitApiArtifact)
    inputs.property("expectedSha256", expectedWthitApiSha256)
    doLast {
        File artifact = configurations.wthitApiArtifact.singleFile
        String digest = java.security.MessageDigest.getInstance("SHA-256")
                .digest(artifact.bytes)
                .encodeHex()
                .toString()
        if (artifact.length() != 118219L || digest != expectedWthitApiSha256) {
            throw new GradleException("Unexpected WTHIT API artifact: ${artifact.name}, ${artifact.length()} bytes, SHA-256 ${digest}")
        }
    }
}

tasks.named("compileJava") {
    dependsOn(tasks.named("verifyWthitApiArtifact"))
}

def modVersion = project.version
def minecraftVersion = project.minecraft_version
def loaderVersion = project.loader_version
def fabricVersion = project.fabric_version

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    inputs.property "fabric_version", fabricVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                "version": modVersion,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion,
                "fabric_version": fabricVersion
        )
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

tasks.named("sourcesJar") {
    mustRunAfter(tasks.named("runDatagen"))
}
