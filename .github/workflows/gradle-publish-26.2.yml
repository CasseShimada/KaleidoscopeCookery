# Official upstream history is connected through KaleidoscopeMods/KaleidoscopeCookery@1d935a2c5773452aa8ad399938fac29a6d3d4695.
name: Gradle Package 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - "26.2-fabric"
    tags:
      - "*-fabric+mc26.2"
    paths:
      - 'src/main/**'
      - 'src/client/**'
      - 'src/gametest/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/gradle-publish-26.2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Validate generated resources and build
        run: |
          chmod +x ./gradlew
          rm -rf src/main/generated
          ./gradlew runDatagen --warning-mode all
          if [ -n "$(git status --porcelain -- src/main/generated)" ]; then
            echo "Datagen output is out of date:"
            git status --short -- src/main/generated
            exit 1
          fi
          ./gradlew build runGameTest --warning-mode all
          for verifier in scripts/verify_*.py; do
            python3 "$verifier"
          done

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ -z "$version" ]; then
            echo "mod_version is missing"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$version" ]; then
            echo "Tag ${{ github.ref_name }} does not match mod_version $version"
            exit 1
          fi
          jar="build/libs/kaleidoscopecookery-${version}.jar"
          if [ ! -f "$jar" ]; then
            echo "Expected release artifact is missing: $jar"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Create timestamp
        id: create_timestamp
        if: github.ref_type != 'tag'
        run: echo "timestamp=$(date '+%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Publish snapshot prerelease
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ steps.create_timestamp.outputs.timestamp }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: true
          files: ${{ steps.version.outputs.jar }}

      - name: Publish formal release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Kaleidoscope Cookery ${{ steps.version.outputs.version }}
          body: |
            Formal Minecraft 26.2 Fabric release built and tested by GitHub Actions from `${{ github.sha }}`.
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ steps.version.outputs.jar }}

      - name: Cleanup Gradle Cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
