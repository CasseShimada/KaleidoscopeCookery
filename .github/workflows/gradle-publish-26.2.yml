name: Gradle Package 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - 'src/main/**'
      - 'src/client/**'
      - 'src/gametest/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/gradle-publish-26.2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "main"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Validate generated resources and build
        run: |
          chmod +x ./gradlew
          rm -rf src/main/generated
          ./gradlew runDatagen --warning-mode all
          if [ -n "$(git status --porcelain -- src/main/generated)" ]; then
            echo "Datagen output is out of date:"
            git status --short -- src/main/generated
            exit 1
          fi
          ./gradlew build --warning-mode all
          python3 scripts/verify_resources.py
          python3 scripts/verify_server_boundary.py
          python3 scripts/verify_mixins.py
          python3 scripts/verify_network_safety.py
          python3 scripts/verify_block_entities.py
          python3 scripts/verify_recipes.py
          python3 scripts/verify_data_pack.py
          python3 scripts/verify_client_assets.py
          python3 scripts/verify_release_hygiene.py

      - name: Create timestamp
        id: create_timestamp
        run: echo "timestamp=$(date '+%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Send file to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ steps.create_timestamp.outputs.timestamp }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: true
          files: ./build/libs/*.jar

      - name: Cleanup Gradle Cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
